[project]
name = "autoprep"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "TCHALLY", email = "tchallyolivier@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "faker>=40.38.0",
    "langchain>=1.4.0",
    "langchain-anthropic>=1.7.1",
    "langgraph>=1.2.11",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "plotly>=7.0.0",
    "python-dotenv>=1.2.3",
    "streamlit>=1.63.0",
]

[project.scripts]
autoprep = "autoprep:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"
